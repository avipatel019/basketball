name: Deploy to GitHub Pages

# NOTE: GitHub Pages must be enabled once for this repo before this workflow
# can publish: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# The Actions GITHUB_TOKEN cannot enable Pages automatically on the first run.
on:
  # Auto-deploy once changes land on the production branch.
  push:
    branches: ["main"]
  # Allow manual runs (used to publish after Pages is enabled).
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages and verify the deployment origin
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages via the API on first run if it isn't already on
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repository root (static HTML/CSS/JS)
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
